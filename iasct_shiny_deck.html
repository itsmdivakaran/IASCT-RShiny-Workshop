<title>R Shiny for Clinical Dashboards</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

:root{
  --ink:#1B2340;
  --paper:#F5F6FA;
  --surface:#FFFFFF;
  --surface-2:#EDEFF7;
  --accent:#2C3E7A;
  --accent-soft:#DCE3F5;
  --teal:#0F7A7A;
  --teal-soft:#D6EEEC;
  --amber:#C97A22;
  --amber-soft:#F5E4CC;
  --muted:#5B6182;
  --line:#D6D9E8;
  --code-bg:#161C33;
  --code-ink:#DCE1F5;
  --code-accent:#7FA3FF;
  --code-string:#8FD6C4;
  --code-comment:#6B7299;
  --code-key:#F2B266;
  --shadow: 0 20px 50px -20px rgba(27,35,64,0.35);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#E8EAF6; --paper:#0F1224; --surface:#171B33; --surface-2:#1E2440;
    --accent:#7C97F5; --accent-soft:#293463; --teal:#4FCFC6; --teal-soft:#173634;
    --amber:#F0AE64; --amber-soft:#3A2C15; --muted:#A6ABCB; --line:#2C3159;
    --code-bg:#0B0E1E; --code-ink:#DCE1F5; --code-accent:#8FB0FF; --code-string:#9BE0CE;
    --code-comment:#6B7299; --code-key:#F2B266; --shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
  }
}
:root[data-theme="dark"]{
  --ink:#E8EAF6; --paper:#0F1224; --surface:#171B33; --surface-2:#1E2440;
  --accent:#7C97F5; --accent-soft:#293463; --teal:#4FCFC6; --teal-soft:#173634;
  --amber:#F0AE64; --amber-soft:#3A2C15; --muted:#A6ABCB; --line:#2C3159;
  --code-bg:#0B0E1E; --code-ink:#DCE1F5; --code-accent:#8FB0FF; --code-string:#9BE0CE;
  --code-comment:#6B7299; --code-key:#F2B266; --shadow: 0 20px 50px -20px rgba(0,0,0,0.6);
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:#0B0D18; color:var(--ink); font-family:'IBM Plex Sans', system-ui, sans-serif; overflow:hidden; height:100vh; width:100vw; display:flex; align-items:center; justify-content:center;}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]) body{background:#DCE0EC;} }
:root[data-theme="light"] body{background:#DCE0EC;}
@media (prefers-reduced-motion: reduce){*{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}}

h1,h2,h3{font-family:'Fraunces', Georgia, serif; text-wrap:balance; margin:0; letter-spacing:-0.01em;}
.eyebrow{font-family:'IBM Plex Mono', monospace; font-size:14px; text-transform:uppercase; letter-spacing:0.15em; color:var(--teal); font-weight:600;}
code,.mono{font-family:'IBM Plex Mono', monospace;}

/* ===== Fixed-aspect presentation canvas (design size 1280x720, uniformly scaled to fit the viewport this is what keeps every slide's proportions exactly as designed regardless of window size) ===== */
#stage-wrap{position:relative; width:1280px; height:720px; flex:none; transform-origin:center center;}
#deck{position:relative; width:1280px; height:720px; overflow:hidden; background:var(--paper); border-radius:10px; box-shadow:0 60px 140px -30px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.06);}
.slide{position:absolute; inset:0; display:flex; flex-direction:column; padding:56px 76px 50px; opacity:0; transform:translateX(48px) scale(0.98); transition:opacity 0.5s cubic-bezier(.22,.61,.36,1), transform 0.5s cubic-bezier(.22,.61,.36,1); pointer-events:none; overflow-y:auto; font-size:17px;}
.slide.active{opacity:1; transform:translateX(0) scale(1); pointer-events:auto; z-index:2;}
.slide.prev{opacity:0; transform:translateX(-48px) scale(0.98);}
.slide-inner{width:100%; height:100%; display:flex; flex-direction:column;}

#progress-track{position:fixed; top:0; left:0; height:3px; width:100%; background:rgba(255,255,255,0.15); z-index:11;}
#progress-bar{height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--teal)); transition:width 0.4s cubic-bezier(.22,.61,.36,1);}
#counter{position:fixed; bottom:14px; left:22px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:#8890B5; z-index:11; letter-spacing:0.04em;}
#counter b{color:#E8EAF6;}
.navbtn{position:fixed; top:50%; transform:translateY(-50%); width:42px; height:42px; border-radius:50%; border:1px solid rgba(255,255,255,0.14); background:rgba(255,255,255,0.06); color:#E8EAF6; display:flex; align-items:center; justify-content:center; cursor:pointer; z-index:11; backdrop-filter:blur(6px); transition:transform 0.2s ease, background 0.2s ease; font-size:1.05rem;}
.navbtn:hover{transform:translateY(-50%) scale(1.08); background:rgba(255,255,255,0.14);}
.navbtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px;}
#prevBtn{left:16px;} #nextBtn{right:16px;}
#tagline{position:fixed; bottom:14px; right:22px; font-family:'IBM Plex Mono',monospace; font-size:12px; color:#8890B5; z-index:11;}
#jumpwrap{position:fixed; bottom:14px; left:50%; transform:translateX(-50%); z-index:11; display:flex; align-items:center; gap:8px;}
#jumpbar{width:min(30vw,360px); height:4px; background:rgba(255,255,255,0.15); border-radius:4px; position:relative; cursor:pointer;}
#jumpfill{position:absolute; left:0; top:0; height:100%; background:var(--accent); border-radius:4px; width:0%;}
#partlabel{font-family:'IBM Plex Mono',monospace; font-size:12px; color:#8890B5; min-width:150px;}

.tag{display:inline-flex; align-items:center; gap:6px; font-family:'IBM Plex Mono',monospace; font-size:13px; text-transform:uppercase; letter-spacing:0.1em; padding:5px 12px; border-radius:100px; background:var(--accent-soft); color:var(--accent); font-weight:600; width:fit-content;}
.tag.teal{background:var(--teal-soft); color:var(--teal);}
.tag.amber{background:var(--amber-soft); color:var(--amber);}

.grid2{display:grid; grid-template-columns:1fr 1fr; gap:34px; align-items:center;}
.grid3{display:grid; grid-template-columns:repeat(3,1fr); gap:24px; align-items:center;}
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:30px 32px; box-shadow:var(--shadow);}
.content-center{flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center;}
.card h3{font-size:21px; margin-bottom:12px; color:var(--ink);}
.card p{margin:0; color:var(--muted); font-size:17px; line-height:1.65;}

ul.clean{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:15px;}
ul.clean li{padding-left:24px; position:relative; color:var(--muted); font-size:17px; line-height:1.6;}
ul.clean li::before{content:"-"; position:absolute; left:0; color:var(--teal); font-weight:600;}
ul.clean li b{color:var(--ink);}

.codepanel{background:var(--code-bg); color:var(--code-ink); border-radius:14px; padding:26px 28px; font-family:'IBM Plex Mono',monospace; font-size:15.5px; line-height:1.85; overflow:auto; box-shadow:var(--shadow); border:1px solid rgba(255,255,255,0.06); white-space:pre-wrap; word-wrap:break-word;}
.codepanel .c-key{color:var(--code-key);} .codepanel .c-str{color:var(--code-string);} .codepanel .c-fn{color:var(--code-accent);} .codepanel .c-cm{color:var(--code-comment); font-style:italic;}
.codepanel::-webkit-scrollbar{height:8px; width:8px;} .codepanel::-webkit-scrollbar-thumb{background:#333a5c; border-radius:4px;}

.timeline{display:flex; flex-direction:column; gap:0; flex:1; min-height:0; overflow-y:auto; padding-right:6px; justify-content:center;}
.trow{display:grid; grid-template-columns:104px 1fr 168px; gap:16px; padding:13px 0; border-bottom:1px solid var(--line); align-items:start;}
.trow:last-child{border-bottom:none;}
.trow .time{font-family:'IBM Plex Mono',monospace; font-size:15px; color:var(--teal); font-weight:600; padding-top:2px;}
.trow .who{font-size:14px; color:var(--muted); text-align:right; padding-top:2px;}
.trow .what b{display:block; font-size:17px; margin-bottom:3px;}
.trow .what span{color:var(--muted); font-size:14.5px;}

.diagram-grid{display:grid; row-gap:26px; column-gap:16px; align-items:center; justify-items:center;}
.dbox{background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:20px 20px; width:100%; min-height:84px; text-align:center; box-shadow:var(--shadow); display:flex; flex-direction:column; align-items:center; justify-content:center;}
.dbox b{display:block; font-size:16px; margin-bottom:5px;}
.dbox span{font-size:13.5px; color:var(--muted); line-height:1.4;}
.dbox.accent{border-color:var(--accent); background:var(--accent-soft);}
.dbox.teal{border-color:var(--teal); background:var(--teal-soft);}
.dbox.amber{border-color:var(--amber); background:var(--amber-soft);}
.dbox-ghost{visibility:hidden;}
.darrow{color:var(--muted); font-size:22px; font-family:'IBM Plex Mono',monospace;}

.kicker-row{display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:26px; flex-wrap:wrap;}
.title-hero{display:flex; flex-direction:column; justify-content:center; align-items:flex-start; flex:1; gap:24px;}
.title-hero h1{font-size:58px; line-height:1.06; font-weight:600;}
.title-hero .sub{font-size:19px; color:var(--muted); max-width:640px; line-height:1.55;}
.meta-row{display:flex; gap:28px; flex-wrap:wrap; margin-top:4px;}
.meta-item{font-family:'IBM Plex Mono',monospace; font-size:13.5px; color:var(--muted);}
.meta-item b{color:var(--ink); display:block; font-size:16px; font-family:'IBM Plex Sans',sans-serif; margin-bottom:3px;}
.presenter-card{display:flex; align-items:center; gap:14px; background:var(--surface); border:1px solid var(--line); border-radius:100px; padding:10px 24px 10px 10px; box-shadow:var(--shadow); width:fit-content;}
.avatar{width:52px; height:52px; border-radius:50%; flex:none; background:linear-gradient(135deg,var(--accent),var(--teal)); display:flex; align-items:center; justify-content:center; color:white; font-family:'Fraunces',serif; font-weight:600; font-size:19px;}
.presenter-card .pname{font-weight:600; font-size:16px;} .presenter-card .prole{color:var(--muted); font-size:13.5px;}

.pillrow{display:flex; gap:10px; flex-wrap:wrap;}
.pill{background:var(--surface-2); border:1px solid var(--line); border-radius:100px; padding:7px 15px; font-size:13.5px; color:var(--muted); font-family:'IBM Plex Mono',monospace;}
.bignum{font-family:'Fraunces',serif; font-size:38px; color:var(--accent); font-weight:600; line-height:1;}

.divider-num{font-family:'Fraunces',serif; font-size:220px; font-weight:600; color:var(--accent-soft); line-height:0.9; position:absolute; top:5%; right:3%; z-index:0; opacity:0.6;}
.divider-content{position:relative; z-index:1;}

.two-col-text{display:flex; flex-direction:column; gap:16px; justify-content:center;}
.big-body{font-size:19px; color:var(--muted); line-height:1.6; max-width:62ch;}
</style>

<div id="stage-wrap"><div id="deck"></div></div>
<div id="progress-track"><div id="progress-bar"></div></div>
<button class="navbtn" id="prevBtn" aria-label="Previous slide">&#8592;</button>
<button class="navbtn" id="nextBtn" aria-label="Next slide">&#8594;</button>
<div id="counter"><b id="curNum">01</b> / <span id="totalNum">100</span></div>

<div id="jumpwrap"><span id="partlabel"></span><div id="jumpbar"><div id="jumpfill"></div></div></div>

<script>
const SLIDES = [];
let PART = "";
function setPart(name){ PART = name; }

function wrap(inner, extraStyle=""){
  return `<div class="slide-inner"${extraStyle?` style="${extraStyle}"`:""}>${inner}</div>`;
}

function head(eyebrow, title, tagRight=""){
  return `<div class="kicker-row"><div><span class="eyebrow">${eyebrow}</span><h2 style="font-size:33px;margin-top:8px;max-width:900px;">${title}</h2></div>${tagRight}</div>`;
}

function divider(numLabel, title, sub, pills=[]){
  SLIDES.push({part:PART, html: wrap(`
    <div class="divider-num">${numLabel}</div>
    <div class="divider-content" style="display:flex;flex-direction:column;justify-content:center;flex:1;gap:20px;">
      <span class="eyebrow">${PART}</span>
      <h1 style="font-size:50px;max-width:880px;">${title}</h1>
      <p class="big-body">${sub}</p>
      ${pills.length? `<div class="pillrow">${pills.map(p=>`<span class="pill">${p}</span>`).join("")}</div>`:""}
    </div>
  `,"justify-content:center;")});
}

function concept(eyebrow, title, leftHead, leftItems, rightHead, rightItems, tagRight=""){
  const rightBlock = rightItems ? `
    <div class="card"><h3>${rightHead}</h3><ul class="clean">${rightItems.map(i=>`<li>${i}</li>`).join("")}</ul></div>` : "";
  const leftBlock = `<div class="card"><h3>${leftHead}</h3><ul class="clean">${leftItems.map(i=>`<li>${i}</li>`).join("")}</ul></div>`;
  SLIDES.push({part:PART, html: wrap(`
    ${head(eyebrow,title,tagRight)}
    <div class="content-center">
      <div class="${rightItems?'grid2':''}" style="${!rightItems?'max-width:760px;':''}">
        ${leftBlock}${rightBlock}
      </div>
    </div>
  `)});
}

function focus(eyebrow, title, bodyHtml, tagRight=""){
  SLIDES.push({part:PART, html: wrap(`
    ${head(eyebrow,title,tagRight)}
    <div class="content-center"><div class="card">${bodyHtml}</div></div>
  `)});
}

function codeSlide(eyebrow, title, code, bullets, tagRight=""){
  SLIDES.push({part:PART, html: wrap(`
    ${head(eyebrow,title,tagRight)}
    <div class="content-center">
      <div class="grid2">
        <div class="codepanel">${code}</div>
        <div class="two-col-text"><ul class="clean">${bullets.map(b=>`<li>${b}</li>`).join("")}</ul></div>
      </div>
    </div>
  `)});
}

function three(eyebrow, title, cards, tagRight=""){
  SLIDES.push({part:PART, html: wrap(`
    ${head(eyebrow,title,tagRight)}
    <div class="content-center">
      <div class="grid3">
        ${cards.map(c=>`<div class="card"><h3>${c.h}</h3><p>${c.p}</p></div>`).join("")}
      </div>
      ${cards.note? `<div class="card" style="margin-top:16px;"><h3>${cards.note.h}</h3><p>${cards.note.p}</p></div>`:""}
    </div>
  `)});
}

function diagramSlide(eyebrow, title, rows, note){
  const n = rows[0].length;
  const template = [];
  for(let i=0;i<n;i++){ template.push('1fr'); if(i<n-1) template.push('44px'); }
  const cellsHtml = rows.map(row => row.map((b,i)=>{
    const boxHtml = b===null
      ? `<div class="dbox dbox-ghost"></div>`
      : `<div class="dbox ${b.cls||''}"><b>${b.t}</b><span>${b.s}</span></div>`;
    const arrowHtml = i<row.length-1 ? `<div class="darrow">&rarr;</div>` : "";
    return boxHtml + arrowHtml;
  }).join("")).join("");
  SLIDES.push({part:PART, html: wrap(`
    ${head(eyebrow,title)}
    <div class="content-center">
      <div class="diagram-grid" style="grid-template-columns:${template.join(' ')};">${cellsHtml}</div>
      ${note? `<div class="card" style="margin-top:26px;"><h3>${note.h}</h3><p>${note.p}</p></div>`:""}
    </div>
  `)});
}

function timelineSlide(eyebrow, title, tagRight, rows){
  SLIDES.push({part:PART, html: wrap(`
    ${head(eyebrow,title,tagRight)}
    <div class="timeline">${rows.map(r=>`
      <div class="trow"><div class="time">${r.t}</div><div class="what"><b>${r.b}</b><span>${r.s}</span></div><div class="who">${r.w}</div></div>
    `).join("")}</div>
  `)});
}

setPart("Opening");

SLIDES.push({part:PART, html: wrap(`
  <div class="title-hero">
    <span class="tag">IASCT Workshop &middot; 12 September 2026</span>
    <h1>Building Interactive Dashboards<br>for Smarter Insights Using R&nbsp;Shiny</h1>
    <p class="sub">A full-day, hands-on workshop &mdash; from R&nbsp;Shiny fundamentals through a live Mini TFL Builder to AI/LLM-assisted clinical output generation.</p>
    <div class="meta-row">
      <div class="meta-item"><b>10:00 AM &ndash; 06:00 PM</b>Full-day, in-person</div>
      <div class="meta-item"><b>5 Sessions</b>Concepts &rarr; hands-on &rarr; AI</div>
      <div class="meta-item"><b>Mini TFL Builder</b>Live demo app in R&nbsp;Shiny</div>
    </div>
    <div class="presenter-card">
      <div class="avatar">MD</div>
      <div><div class="pname">Mahesh Divakaran</div><div class="prole">Senior Tech Lead &ndash; R Developer, Ephicacy Life Science Analytics</div></div>
    </div>
  </div>
`)});

focus("Presenter", "About your speaker today", `
  <div class="grid2" style="height:auto;">
    <div>
      <p style="color:var(--muted);line-height:1.6;">Mahesh Divakaran is a Senior Tech Lead and R Developer at Ephicacy Life Science Analytics, specializing in R Shiny application development for clinical trial reporting &mdash; from ADaM-driven TFL automation to interactive review dashboards and, most recently, LLM-assisted output generation.</p>
      <div class="pillrow" style="margin-top:14px;"><span class="pill">R Shiny</span><span class="pill">Clinical TFLs</span><span class="pill">ADaM / pharmaverse</span><span class="pill">AI integration</span></div>
    </div>
    <div class="presenter-card" style="align-self:center;">
      <div class="avatar">MD</div>
      <div><div class="pname">Mahesh Divakaran</div><div class="prole">Senior Tech Lead &ndash; R Developer<br>Ephicacy Life Science Analytics</div></div>
    </div>
  </div>
`);

concept("Learning Outcomes", "What you'll be able to do by 6:00 PM",
  "Concepts", ["Explain where R Shiny fits among clinical dashboard tools", "Describe the UI / Server / Reactive-engine model", "Recognize the building blocks of a clinical TFL dashboard"],
  "Hands-on", ["Build and filter a mini TFL dashboard from ADaM data", "Export a table to HTML, Word and CSV, and a figure to PNG/SVG", "See a working pattern for LLM-assisted TFL generation"]
);

timelineSlide("Today's Flow", "Five sessions, one working dashboard", `<span class="tag teal">09:45 &ndash; 18:00</span>`, [
  {t:"09:45", b:"Welcome & Introductions", s:"Setting expectations for the day", w:"IASCT EC member"},
  {t:"10:00", b:"S1 &middot; Context & Use Cases", s:"Why dashboards, where R Shiny fits", w:"Mahesh, Venkatesh"},
  {t:"10:45", b:"S2 &middot; Setup & Building Blocks", s:"UI / Server / Reactivity / Modules", w:"Mahesh, Venkatesh"},
  {t:"11:35", b:"S3 &middot; Mini-Shiny Walkthrough", s:"A clinical-trial scenario, live", w:"Speaker, Mahesh"},
  {t:"13:30", b:"S4 &middot; Mini TFL Builder", s:"Interactivity & output exports, hands-on", w:"Speaker, Venkatesh + Audience"},
  {t:"15:45", b:"S5 &middot; AI & LLM Integration", s:"Chatbot-driven TFL generation", w:"Venkatesh, Mahesh"},
  {t:"17:30", b:"Closing & Concluding Remarks", s:"Summary and open Q&amp;A", w:"IASCT EC member"},
]);

timelineSlide("Today's Flow", "Morning at a glance &mdash; concepts into a live build", "", [
  {t:"09:45", b:"Introduction of IASCT and speakers", s:"Welcome note, expectations for the day", w:"IASCT EC member"},
  {t:"10:00", b:"Dashboard purpose & clinical trial use cases", s:"Static reports &rarr; interactive analytics", w:"Mahesh"},
  {t:"10:15", b:"R Shiny positioning", s:"vs. Tableau, Spotfire, Qlik, SAS VA; network graphs, heatmaps", w:"Venkatesh"},
  {t:"10:30", b:"High-level design considerations", s:"Compliance, traceability, common mistakes", w:"Mahesh"},
  {t:"10:45", b:"Environment setup", s:"R, RStudio, packages, project structure", w:"Mahesh"},
  {t:"10:55", b:"UI, server, reactivity, module concepts", s:"Architecture overview", w:"Mahesh"},
  {t:"11:10", b:"Building blocks for dashboard workflows", s:"Data loading modules, reusable practices", w:"Venkatesh"},
  {t:"11:15", b:"Interactivity in graphs", s:"Dynamic, linked, drill-down visuals", w:"Venkatesh"},
]);

timelineSlide("Today's Flow", "Afternoon at a glance &mdash; build, export, and go AI-assisted", "", [
  {t:"11:35", b:"Mini-Shiny Dashboard Walkthrough", s:"Problem statement, table vs. figure, AE workflow", w:"Speaker, Mahesh"},
  {t:"12:15", b:"Q&A and recap before lunch", s:"", w:"All"},
  {t:"13:30", b:"Mini TFL Builder &mdash; hands-on build", s:"Arm &rarr; Population &rarr; AE Summary Table", w:"Speaker, Venkatesh + Audience"},
  {t:"14:15", b:"Interactivity for reviewing outputs", s:"AE incidence viz, reactive filtering", w:"Audience"},
  {t:"15:00", b:"Exporting to PDF and Word", s:"Download/export functionality, reusability", w:"Audience + Mahesh"},
  {t:"15:45", b:"AI/LLM integration patterns", s:"With Ollama or OpenAI API", w:"Venkatesh"},
  {t:"16:15", b:"Chatbot interface in R Shiny", s:"", w:"Venkatesh"},
  {t:"16:45", b:"Illustrative use case with the mini TFL app", s:"", w:"Venkatesh + Mahesh"},
]);

setPart("Session 1 Â· Context & Use Cases");
divider("01", "R Shiny in Clinical Trial Dashboards", "Context, positioning, and design considerations for teams already comfortable with R Shiny basics.", ["10:00 â 10:45","Mahesh + Venkatesh"]);

concept("10:00 â 10:15 Â· Mahesh", "Evolution from static reports to interactive analytics",
  "What's changing", [
    "Static PDF/RTF TFLs answer only the exact question they were built for",
    "Interactive dashboards let a reviewer ask the <i>next</i> question without a new programming request",
    "The underlying statistical logic doesn't change &mdash; only how a user reaches it does"
  ],
  "Where it shows up", [
    "Ad-hoc safety review during DSMB preparation",
    "Cross-functional study team check-ins",
    "Exploratory data review ahead of a formal analysis"
  ]
);

concept("10:00 â 10:15 Â· Mahesh", "Dashboards for study monitoring and decision support",
  "Monitoring use cases", [
    "Enrollment and disposition tracking across sites",
    "Ongoing AE signal monitoring outside the locked-database cycle",
    "Query and data-quality trend views for CRAs and DM"
  ],
  "Decision support", [

focus("Reference Â· Reactive Vocabulary", "req() â the quiet guard used everywhere", `
  <p style="color:var(--muted);line-height:1.6;"><code class="mono">req(x)</code> stops a reactive expression silently if <code class="mono">x</code> is missing, empty, or FALSE no error banner, the output simply doesn't render yet. It's how <code class="mono">table_data()</code> waits for treatment arms to be selected before attempting to build anything, and how <code class="mono">datasets()</code> waits for a file upload without crashing on <code class="mono">NULL</code>.</p>
`);
focus("Reference Â· Reactive Vocabulary", "isolate() â reading a reactive without depending on it", `
  <p style="color:var(--muted);line-height:1.6;"><code class="mono">isolate(x())</code> reads a reactive's current value <i>without</i> creating a dependency on it useful inside an <code class="mono">observeEvent()</code> when you want a button click to trigger the update, not every keystroke in an accompanying text field. Not used directly in today's app, but essential once a chat-style interface (Session 5) needs to read the current filter state only at send-time.</p>
`);
focus("Reference Â· Reactive Vocabulary", "observeEvent() vs. reactive() â side effect vs. value", `
  <p style="color:var(--muted);line-height:1.6;">A <code class="mono">reactive()</code> is called like a function and returns a value <code class="mono">table_data()</code> is read by multiple outputs. An <code class="mono">observeEvent()</code> runs for its side effect and returns nothing meaningful used for things like <code class="mono">showNotification()</code> or writing to a log. Mixing the two up is the most common source of confusing bugs for teams new to Shiny.</p>
`);
focus("Reference Â· Reactive Vocabulary", "renderUI() / uiOutput() â server-generated UI", `
  <p style="color:var(--muted);line-height:1.6;">Some UI can't be written once in the UI function because its choices depend on data that isn't known until runtime which population flags exist, which treatment arms are present. <code class="mono">uiOutput("tbl_pop_flag_ui")</code> in the UI pairs with <code class="mono">renderUI({...})</code> in the server to generate that control dynamically, every time the underlying dataset changes.</p>
`);
focus("Reference Â· Reactive Vocabulary", "The %||% null-coalescing operator", `
  <p style="color:var(--muted);line-height:1.6;"><code class="mono">a %||% b</code> returns <code class="mono">a</code> if it isn't <code class="mono">NULL</code>, otherwise <code class="mono">b</code>. Defined at the bottom of <code class="mono">app.R</code> and used in <code class="mono">table_data()</code> as <code class="mono">input$min_pct %||% 0</code> a one-line defensive default for a control that hasn't rendered on the very first page load yet.</p>
`);

codeSlide("Code Â· Shared Filtering", "prep_adsl() â part 1: population & treatment filter", `prep_adsl <- function(adsl, trt_var,
      pop_flag, trts, show_total) {
  d <- if (pop_flag == "__ALL__") adsl
       else filter(adsl,
              .data[[pop_flag]] == "Y")
  d <- filter(d, .data[[trt_var]] %in% trts) |>
    mutate(TRT = factor(.data[[trt_var]],
                     levels = trts))`, [
  "Every table and figure builder calls <code class=\"mono\">prep_adsl()</code> first it's the single choke point for filtering logic",
  "<code class=\"mono\">.data[[pop_flag]]</code> uses tidy-eval to filter by a <i>column name stored in a variable</i> essential since the population flag is a user selection, not hardcoded",
  "<code class=\"mono\">factor(..., levels = trts)</code> locks treatment display order to the order the user selected arms in"
]);

codeSlide("Code Â· Shared Filtering", "prep_adsl() â part 2: synthesizing the Total column", `  N <- setNames(as.integer(table(d$TRT)), trts)
  all_lvls <- if (show_total) c(trts, "Total") else trts

  if (show_total) {
    d <- bind_rows(d, mutate(d,
             TRT = factor("Total", levels = all_lvls)))
    N <- c(N, Total = sum(N))
  }
  list(d = d, N = N, all_lvls = all_lvls)
}`, [
  "The \"Total\" column isn't special-cased downstream it's manufactured by <i>duplicating every row</i> with <code class=\"mono\">TRT</code> relabeled to <code class=\"mono\">\"Total\"</code>",
  "Because it's just another factor level, every <code class=\"mono\">count()</code>/<code class=\"mono\">pivot_wider()</code> call downstream treats it identically to a real arm",
  "Returns a 3-part list <code class=\"mono\">d</code>, <code class=\"mono\">N</code>, <code class=\"mono\">all_lvls</code> that every builder destructures the same way"
]);

codeSlide("Code Â· Shared Filtering", "wide_counts() â count, join, pivot in one call", `wide_counts <- function(d, grp_cols, N, all_lvls) {
  d |>
    count(TRT, across(all_of(grp_cols))) |>
    right_join(expand.grid(...),  # fills implicit zeros
               by = c("TRT", grp_cols)) |>
    mutate(n = replace_na(n, 0L),
           val = fmt_n_pct(n, N[as.character(TRT)])) |>
    pivot_wider(names_from = TRT, values_from = val)
}`, [
  "<code class=\"mono\">expand.grid()</code> + <code class=\"mono\">right_join()</code> is the trick that turns \"0 subjects had this category\" from a missing row into an explicit <code class=\"mono\">\"0 (0.0%)\"</code>",
  "Reused by <code class=\"mono\">build_demog()</code> (sex, race), <code class=\"mono\">build_dispos()</code> (status), and <code class=\"mono\">build_ae_sev()</code> (severity) one function, three tables",
  "Ends in wide format: one column per treatment arm, ready to hand to <code class=\"mono\">gt()</code>"
]);

focus("Code Â· Shared Filtering", "hdr_row() â the \"(N=xx)\" header row", `
  <p style="color:var(--muted);">A tiny helper that builds a single-row tibble like <code class="mono">Characteristic | (N=64) | (N=62) | (N=126)</code> using the treatment N's computed in <code class="mono">prep_adsl()</code>. Every table prepends one of these via <code class="mono">bind_rows()</code> so the reader always sees the denominator before reading a single percentage directly addressing the \"don't hide the N\" design principle from Session 1.</p>
`);

  "This pattern makes adding a new TEAE category (e.g. \"Leading to Dose Reduction\") a one-line addition to the <code class=\"mono\">rows</code> list, no new function needed",
  "<code class=\"mono\">tryCatch()</code> around <code class=\"mono\">cnt()</code> means a missing variable degrades to \"N/A\" per-row rather than crashing the table"
]);

codeSlide("Table Builder 4/5", "build_ae_socpt() â AE by SOC/PT (T14.3.2), part 1", `mk_counts <- function(id_cols) {
  d_ae |>
    distinct(USUBJID, TRT, !!!syms(id_cols)) |>
    count(TRT, !!!syms(id_cols)) |>
    mutate(pct = 100 * n / N[as.character(TRT)]) |>
    pivot_wider(id_cols=id_cols, names_from=TRT,
       values_from=c(val,pct))
}
soc_df <- mk_counts("AEBODSYS")
pt_df  <- mk_counts(c("AEBODSYS","AEDECOD"))`, [
  "<code class=\"mono\">distinct(USUBJID, ...)</code> before counting is the key correctness step: a subject with 3 events of the same PT is still counted <i>once</i> for incidence",
  "One helper, <code class=\"mono\">mk_counts()</code>, generates both the SOC-level and PT-level count tables by just changing which grouping columns are passed in",
  "<code class=\"mono\">!!!syms(id_cols)</code> is tidy-eval splicing a character vector of column names into <code class=\"mono\">dplyr</code> verbs that normally expect bare column names"
]);

codeSlide("Table Builder 4/5", "build_ae_socpt() â AE by SOC/PT (T14.3.2), part 2", `rows <- map_dfr(soc_sorted$AEBODSYS, function(soc) {
  soc_row <- filter(soc_df, AEBODSYS==soc) |>
    mutate(Level = "SOC")
  pt_rows <- filter(pt_df, AEBODSYS==soc) |>
    arrange(desc(pct)) |>
    mutate(Term = paste0("   ", Term),
           Level = "PT")
  bind_rows(soc_row, pt_rows)
})`, [
  "SOC rows are sorted by mean incidence across arms; within each SOC block, PT rows are sorted by their own descending incidence a nested sort, built with two <code class=\"mono\">arrange()</code> calls at two levels of <code class=\"mono\">map_dfr()</code>",
  "PT rows get 3 leading spaces prepended to <code class=\"mono\">Term</code> for visual indentation a simple text trick that avoids a more complex nested-table rendering approach",
  "<code class=\"mono\">Level</code> (\"SOC\" / \"PT\") travels through to the <code class=\"mono\">gt</code> renderer, which uses it purely for styling (bold SOC rows), then is dropped before export"
]);

codeSlide("Table Builder 5/5", "build_ae_sev() â AE by Max Severity (T14.3.3)", `sev_lvls <- c("MILD","MODERATE","SEVERE")

result <- wide_counts(
  mutate(d_ae, AESEV = factor(AESEV, levels=sev_lvls)) |>
    distinct(USUBJID, TRT, AESEV),
  "AESEV", N, lvls
) |> rename(Severity = AESEV)`, [
  "The 4th call site for <code class=\"mono\">wide_counts()</code> in the app the same helper now handles a third categorical variable with zero new counting logic",
  "<code class=\"mono\">distinct(USUBJID, TRT, AESEV)</code> again ensures each subject is counted once per severity level, not once per event",
  "Explicit factor <code class=\"mono\">levels</code> ordering keeps Mild &rarr; Moderate &rarr; Severe in clinical reading order regardless of alphabetical sort"
]);

codeSlide("The gt Renderer, 2/2", "to_gt() â conditional styling", `if (tbl_type == "ae_socpt" && "Level" %in% names(df)) {

codeSlide("Figure Builder 3/3", "build_ae_bar() â Top TEAEs by Incidence (F14.3.1)", `adae |> filter(TRTEMFL=="Y") |>

codeSlide("Server Â· Data Loading", "datasets() â the one reactive everything depends on", `datasets <- reactive({
  if (input$data_source == "builtin") return(BUILTIN)
  req(input$upload_files)
  withProgress(message = "Loading datasets...", {
    for (i in seq_len(nrow(input$upload_files))) {
      nm <- toupper(file_path_sans_ext(...))
      df <- switch(ext, "sas7bdat"=haven::read_sas(fp), ...)
      result[[nm]] <- df
    }
  })
})`, [
  "This is the <i>only</i> reactive that reads <code class=\"mono\">input$data_source</code> or <code class=\"mono\">input$upload_files</code> directly every other reactive in the app depends on <code class=\"mono\">datasets()</code>, never on the raw inputs",
  "<code class=\"mono\">req()</code> means: if no files are uploaded yet, this reactive simply doesn't run no error, the UI just waits",
  "<code class=\"mono\">withProgress()</code> shows a native Shiny progress bar during file parsing, important once someone uploads a large ADAE"
]);

codeSlide("Server Â· Dynamic Choices", "pop_flags_available() and trt_vars_available()", `pop_flags_available <- reactive({
  fl <- adsl_cols()[grepl("FL$", adsl_cols())]

})`, [
  "Population flags aren't hardcoded to <code class=\"mono\">SAFFL</code> any column ending in <code class=\"mono\">FL</code> that only contains Y/N/NA values is auto-detected as a valid population flag",
  "This is what makes the app work against <i>any</i> uploaded ADSL, not just the specific one shipped in the demo",
  "Treatment variables use a similar pattern: try common names (<code class=\"mono\">TRT01A</code>, <code class=\"mono\">ARM</code>...) first, fall back to a regex match on <code class=\"mono\">^TRT[0-9]</code>"
]);

codeSlide("Server Â· Reusable Reactive Factory", "trt_levels_for() â a function that returns a reactive", `trt_levels_for <- function(trt_var_input, pop_flag_input) {
  reactive({
    req(trt_var_input(), datasets()$ADSL)
    pop <- if (pop_flag_input() != "__ALL__")
      filter(adsl, .data[[pop_flag_input()]]=="Y") else adsl
    sort(unique(as.character(pop[[trt_var_input()]])))
  })
}
tbl_trt_levels <- trt_levels_for(reactive(input$tbl_trt_var), ...)
fig_trt_levels <- trt_levels_for(reactive(input$fig_trt_var), ...)`, [
  "A <i>function that builds and returns a reactive</i> called once for the Tables tab, once for the Figures tab, avoiding duplicated reactive logic between two nearly-identical control panels",
  "Taking reactives as arguments (<code class=\"mono\">trt_var_input</code>, <code class=\"mono\">pop_flag_input</code>) rather than plain values keeps the returned reactive correctly wired into Shiny's dependency graph",
  "\"Screen failure\" treatment levels are explicitly filtered out, since they're not a meaningful treatment arm for TFL purposes"
]);

codeSlide("Server Â· Table Pipeline", "table_data() â the dispatch reactive", `table_data <- reactive({
  req(input$tbl_trt_arms, input$tbl_pop_flag, datasets()$ADSL)
  withProgress(message = "Building table...", {
    switch(input$table_type,
      demog       = build_demog(adsl, trt, pop, trts, tot),
      ae_socpt    = { req(adae)
        build_ae_socpt(adsl, adae, trt, pop, trts, tot,
          min_pct = input$min_pct %||% 0, sevs = input$sev_filter) },
      ...)
  })
})`, [
  "This is the \"switchboard\" the only place in the server that decides <i>which</i> <code class=\"mono\">build_*()</code> function to call, based on the dropdown selection",
  "<code class=\"mono\">req(adae)</code> is nested inside the AE-specific branches only a demographics table doesn't need ADAE to exist, so it isn't blocked by a missing upload",
  "The custom <code class=\"mono\">%||%</code> operator (defined at the bottom of the file) supplies a default when a control hasn't rendered yet, avoiding a <code class=\"mono\">NULL</code> error on first load"
]);

codeSlide("Server Â· Rendering & Export", "render_gt() and the three table download handlers", `output$tbl_output <- render_gt({
  to_gt(req(table_data()), input$table_type,
        TABLE_TITLES[input$table_type], lvls)
})

output$dl_tbl_docx <- downloadHandler(
  filename = function() paste0(input$table_type,"_",Sys.Date(),".docx"),
  content = function(f) {
    ft <- flextable(out_df) |> bold(part="header") |> autofit()
    doc <- read_docx() |> body_add_flextable(ft)

  })`, [
  "<code class=\"mono\">render_gt()</code> and every <code class=\"mono\">downloadHandler()</code> independently call <code class=\"mono\">table_data()</code> Shiny's reactive caching means the underlying computation runs once and is reused, not recomputed per output",
  "HTML export uses <code class=\"mono\">gtsave()</code>, CSV export uses <code class=\"mono\">write.csv()</code> on the raw data frame, and Word export rebuilds the table in <code class=\"mono\">flextable</code> three renderers, one shared source of truth",
  "The Word export is fully programmatic: <code class=\"mono\">officer::read_docx()</code> creates the document in memory, no Word template file is required"
]);

codeSlide("Server Â· Figure Pipeline", "active_plot() and the PNG/SVG download handlers", `active_plot <- reactive({
  switch(input$figure_type,
    boxplot = build_boxplot(adsl, trt, pop, trts,

output$fig_output <- renderPlot(active_plot(), res = 110)
output$dl_fig_png <- downloadHandler(..., content = function(f)

  "Mirrors <code class=\"mono\">table_data()</code> exactly same dispatch-by-<code class=\"mono\">switch()</code> pattern, applied to figures instead of tables, for a consistent codebase",
  "<code class=\"mono\">renderPlot(..., res = 110)</code> sets screen resolution for on-screen display; <code class=\"mono\">ggsave(..., dpi = 300)</code> uses a separate, higher, publication-quality resolution for the actual export the same plot object serves both",
  "SVG export uses the same call with <code class=\"mono\">device = \"svg\"</code>, giving reviewers a vector format for embedding in slides without quality loss"

codeSlide("16:15 â 16:45 Â· Venkatesh", "Chat module â the shape of the server-side call", `observeEvent(input$send, {
  req(input$chat_msg)
  reply <- call_llm(
    system = SYSTEM_PROMPT,
    tools  = TFL_FUNCTION_SCHEMA,
    user   = input$chat_msg,
    context = list(datasets = names(datasets()),
                    trt_arms = tbl_trt_levels())
  )
  if (reply$type == "function_call")
    do.call(reply$fn, reply$args)   # e.g. build_ae_socpt(...)
})`, [
  "<code class=\"mono\">tools = TFL_FUNCTION_SCHEMA</code> is where the guardrail lives the LLM is only offered the app's existing <code class=\"mono\">build_*()</code> function signatures as callable \"tools\", nothing more general",

  "<code class=\"mono\">do.call(reply$fn, reply$args)</code> is the only place a model's output touches execution and <code class=\"mono\">reply$fn</code> is validated against an allow-list before this line runs"
]);

focus("Guardrails", "Why we don't let the LLM write or execute R code directly", `
  <ul class="clean">
    <li><b>Determinism</b> the same intent always maps to the same validated function, so results stay reproducible run to run</li>
    <li><b>Auditability</b> every AI-assisted output can be traced to a specific function call and argument set, same as a manual selection</li>
    <li><b>Safety</b> no arbitrary code execution surface inside a clinical application, regardless of what a prompt injection might attempt</li>
    <li><b>Validation reuse</b> the <code class="mono">build_*()</code> functions are the same ones already reviewed in Sessions 3&ndash;4; the AI layer adds a front door, not a new computation path</li>
  </ul>
`);

focus("Design Considerations", "Ollama â the on-prem fallback", `
  <p style="color:var(--muted);line-height:1.6;">Ollama runs an open-weight model locally or on internal infrastructure, using the same intent-router pattern a request comes in, the model returns a structured function call, <code class="mono">app.R</code>'s existing functions execute it. No data, not even metadata, leaves the network. The trade-off is model capability: open-weight models may need more careful prompt engineering to match hosted-API reliability on structured output.</p>
`);

focus("Data Privacy Considerations", "Clinical data and LLM APIs â what has to be true first", `
  <ul class="clean">

    <li>Redact or aggregate before any data value (vs. schema) is ever included in a prompt</li>
    <li>Confirm the chosen API vendor's data-use and retention terms explicitly permit this use case before go-live</li>
    <li>An on-prem model via Ollama removes this question entirely for the most compliance-sensitive deployments</li>
  </ul>
`);
